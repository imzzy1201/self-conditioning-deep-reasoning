# 05_diffthinker_controlled / tsp — TSP (traveling-salesperson path drawing).
#
# Controlled FLUX.2-klein-base-4B comparison (VanillaFM vs SelfCondFM; LoRA
# rank/alpha 32, lr 1e-4, global batch 16) over the DiffThinker evaluation set.
# difficulties 12,15,18; 300 test instances; judge = cv2 HSV parse, tolerance
# 0.5 (CPU). The new pair is re-selected from SelfCond@16000 by the shared FLOPs
# protocol (docs/flops_protocol.md).

experiment:
  id: tsp
  task: tsp                     # eval_diffthinker --task key
  label: TSP
  backbone: flux2
  mode: paper
  config_version: 1

data:
  data_root: data/diffthinker
  train_data_root: data/diffthinker/EndoCoT-Data/TSP
  train_metadata: data/diffthinker/formatted/TSP/metadata_train.csv
  eval_gt_root: data/diffthinker/EndoCoT/TSP
  eval_metadata: data/diffthinker/formatted/TSP/metadata_test.csv
  difficulties: [12, 15, 18]
  num_eval_samples: 300

model:
  model_id: black-forest-labs/FLUX.2-klein-base-4B
  use_lora: true
  lora_rank: 32
  lora_alpha: 32
  lora_dropout: 0.0

train:
  num_processes: 4
  per_device_batch_size: 1
  gradient_accumulation_steps: 4     # effective batch = 1 x 4 x 4 = 16
  num_workers: 8
  preload_shards_count: 0          # W&B source runs: preload_shards=false/0 (PNG-mode data, no shards)
  learning_rate: 1e-4
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 1000
  vanilla_num_epochs: 26            # latest finished source run
  selfcond_num_epochs: 9           # latest finished source run
  mixed_precision: bf16
  seed: 1201
  save_steps: 2500                   # Vanilla cadence = the source vanilla eval grid
  eval_every_steps: 2500             #   (A ran save 1000 / eval 2500; preflight forces save==eval).
  selfcond_save_steps: 1000          # SelfCond cadence (save == eval per run; source ran 1000/1000)
  selfcond_eval_every_steps: 1000
  max_train_steps_vanilla: 48000
  max_train_steps_selfcond: 16000
  eval_max_samples: 300
  eval_num_inference_steps: 50

method:
  name: proj_condition
  aux_loss: 1
  aux_loss_weight: 0.5
  stop_grad_proj: 1
  zero_proj_when_absent: 0
  proj_time_offset: -10
  condition_time_offset: 10

flops:
  measurement_micro_batches: 100
  grad_accum: 4
  num_processes: 4

eval:
  nfe: 50
  seed: 0
  max_samples: 300
  metric: diffthinker_accuracy       # PASS / manifest instances (full denominator)
  tsp_tolerance: 0.5                 # edge-overlap tolerance (their red lines offset)
  needs_gpu_ocr: false

checkpoints:
  vanilla_dir: outputs/05_diffthinker_controlled/tsp/vanilla
  selfcond_dir: outputs/05_diffthinker_controlled/tsp/selfcond
  paper_selfcond_step: 16000
  paper_vanilla_step: 40000

outputs:
  flops_dir: outputs/05_diffthinker_controlled/tsp/flops
  data_manifest: outputs/05_diffthinker_controlled/tsp/data_manifest.json
  pair_manifest: outputs/05_diffthinker_controlled/tsp/pairs.json
  audit_manifest: outputs/05_diffthinker_controlled/tsp/audit.json
  eval_root: outputs/05_diffthinker_controlled/tsp/eval
  metrics_csv: outputs/05_diffthinker_controlled/tsp/metrics.csv
  summary: outputs/05_diffthinker_controlled/tsp/summary.json
  examples_dir: examples/diffthinker/tsp

examples:
  selection_reason: "vanilla wrong AND selfcond correct at the protocol-selected FLOPs pair"
  n_examples: 3
  historical_ids:                   # historical paper cherry-picks (original record not bundled; see git history)
    - 16_12_013
    - 16_15_003
    - 16_18_013